<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    A copy of the policy the server already sends as a header, for the case
    where the shell is opened straight from disk. `frame-ancestors` is omitted
    on purpose: browsers ignore it in a <meta> delivery and log an error, and
    the header (plus X-Frame-Options: DENY) already covers framing.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="IMRI — offline library and resource centre management">
  <title>IMRI</title>

  <!--
    Inline SVG favicon: no extra request, no raster asset, works offline.

    This is the pre-module placeholder — app.js calls brand.faviconUri() at
    boot and replaces it with the canonical drawing. Keep it a close copy so
    the handover is invisible, but do not treat it as the source of truth.
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='8' y1='0' x2='40' y2='48' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%234F46E5'/%3E%3Cstop offset='.52' stop-color='%236D5BE8'/%3E%3Cstop offset='1' stop-color='%238B5CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='44' height='44' rx='13' fill='url(%23g)'/%3E%3Cpath d='M26.4 17.4H30.2V42.2L28.3 39.6L26.4 42.2Z' fill='%23F59E0B'/%3E%3Cpath d='M22.9 17.2Q13.2 12.2 9.6 14.4Q8.2 15.1 8.2 16.8V28.8Q8.2 30.5 9.6 31.2Q13.2 33.4 22.9 36Z' fill='%23fff' fill-opacity='.88'/%3E%3Cpath d='M25.1 17.2Q34.8 12.2 38.4 14.4Q39.8 15.1 39.8 16.8V28.8Q39.8 30.5 38.4 31.2Q34.8 33.4 25.1 36Z' fill='%23fff'/%3E%3C/svg%3E">

  <!--
    theme-boot runs synchronously, before the stylesheet is applied, so the
    saved theme is on <html> at first paint. Without it a librarian who chose
    light on a dark-mode laptop would see a black flash on every launch.
  -->
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="modulepreload" href="/js/app.js">
</head>
<body>
  <div id="app" class="boot" aria-busy="true">
    <div class="boot__card">
      <!--
        The mark is inlined here rather than fetched, so the splash is fully
        branded before any module has parsed. app.js swaps this node for the
        brand.js drawing at boot; see paintSplashMark().
      -->
      <span class="boot__mark">
        <svg class="brandmark" viewBox="0 0 48 48" width="44" height="44" role="presentation" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="imri-bg-h" x1="8" y1="0" x2="40" y2="48" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#4F46E5"/>
              <stop offset="0.52" stop-color="#6D5BE8"/>
              <stop offset="1" stop-color="#8B5CF6"/>
            </linearGradient>
            <linearGradient id="imri-shine-h" x1="24" y1="2" x2="24" y2="28" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="imri-ribbon-h" x1="29" y1="17" x2="29" y2="42" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FCD34D"/>
              <stop offset="1" stop-color="#F59E0B"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#imri-bg-h)"/>
          <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#imri-shine-h)"/>
          <rect x="3.4" y="3.4" width="41.2" height="41.2" rx="11.8" fill="none"
                stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>
          <path d="M26.4 17.4H30.2V42.2L28.3 39.6L26.4 42.2Z" fill="url(#imri-ribbon-h)"/>
          <path d="M22.9 17.2Q13.2 12.2 9.6 14.4Q8.2 15.1 8.2 16.8V28.8Q8.2 30.5 9.6 31.2Q13.2 33.4 22.9 36Z"
                fill="#ffffff" fill-opacity="0.88"/>
          <path d="M25.1 17.2Q34.8 12.2 38.4 14.4Q39.8 15.1 39.8 16.8V28.8Q39.8 30.5 38.4 31.2Q34.8 33.4 25.1 36Z"
                fill="#ffffff"/>
        </svg>
      </span>
      <span class="boot__brand">IMRI</span>
      <span class="boot__tagline">Library &amp; Resource Centre</span>
    </div>
  </div>
  <noscript>
    <div class="boot">
      <div class="boot__card">
        <span class="boot__brand">IMRI</span>
        <span class="boot__tagline">This application needs JavaScript enabled.</span>
      </div>
    </div>
  </noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
